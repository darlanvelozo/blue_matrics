[project]
name = "bluemetrics-backend"
version = "0.1.0"
description = "BlueMetrics SaaS backend — BI as a Service para Conta Azul"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15,<4.0",
    "djangorestframework-simplejwt>=5.3,<6.0",
    "django-cors-headers>=4.3,<5.0",
    "django-environ>=0.11,<1.0",
    "psycopg[binary]>=3.1,<4.0",
    "redis>=5.0,<6.0",
    "celery>=5.3,<6.0",
    "django-celery-beat>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "cryptography>=42,<46",
    "structlog>=24.1,<25.0",
    "python-dateutil>=2.8,<3.0",
    "sentry-sdk[django]>=2.0,<3.0",
    "stripe>=10,<13",
]

[tool.setuptools]
packages = ["bluemetrics", "apps"]

[tool.setuptools.package-dir]
bluemetrics = "bluemetrics"
apps = "apps"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
    "pytest-cov>=5.0,<6.0",
    "factory-boy>=3.3,<4.0",
    "freezegun>=1.4,<2.0",
    "ruff>=0.5,<1.0",
    "black>=24.0,<26.0",
    "mypy>=1.10,<2.0",
    "django-stubs>=5.0,<6.0",
    "djangorestframework-stubs>=3.15,<4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "PT"]
ignore = ["S101", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S107"]
"**/tests/**/*.py" = ["S105", "S106", "S107", "E501"]
"**/tests.py" = ["S105", "S106", "S107"]
"**/conftest.py" = ["S105", "S106", "S107"]
"**/management/commands/seed_*.py" = ["S311"]  # random.* OK em seeds

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "migrations"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bluemetrics.settings.test"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = false
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "bluemetrics.settings.test"

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py", "manage.py"]
